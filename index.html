<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio — an interactive page-by-page presentation." />
    <title>Portfolio — Selected Work</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="portfolio">
      <header class="intro">
        <p class="eyebrow">Selected work</p>
        <h1>Portfolio</h1>
        <p class="hint">Turn the pages to explore</p>
      </header>

      <section class="reader" aria-label="Portfolio reader">
        <button class="nav-button previous" type="button" aria-label="Previous page">
          <span aria-hidden="true">←</span>
        </button>

        <div class="book-wrap">
          <div class="book" aria-live="polite">
            <canvas class="page underneath" aria-hidden="true"></canvas>
            <canvas class="page current" role="img" aria-label="Portfolio page 1 of 15"></canvas>
          </div>
        </div>

        <button class="nav-button next" type="button" aria-label="Next page">
          <span aria-hidden="true">→</span>
        </button>
      </section>

      <footer class="controls">
        <p class="page-count"><span class="current-number">01</span><span class="divider">/</span><span>15</span></p>
        <a href="Portfolio.pdf" download>Download PDF <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
